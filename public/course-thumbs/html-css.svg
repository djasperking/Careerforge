<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="HTML and CSS from zero. Free beginner course with live code and a certificate.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c1d95"/>
      <stop offset="0.5" stop-color="#be185d"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdba74"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.4" fill="#ffffff" opacity="0.14"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#1e1b4b" flood-opacity="0.45"/>
    </filter>
    <filter id="pop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#dots)"/>
  <circle cx="1180" cy="40" r="210" fill="#ffffff" opacity="0.08"/>
  <circle cx="40" cy="700" r="250" fill="#000000" opacity="0.10"/>

  <!-- ===== Headline ===== -->
  <g font-family="'Arial Black', Impact, 'Segoe UI', Arial, sans-serif" font-weight="900">
    <text x="64" y="132" font-size="38" fill="#fde68a" letter-spacing="6">LEARN</text>

    <g filter="url(#pop)" transform="rotate(-3 220 255)">
      <rect x="56" y="150" width="372" height="152" rx="26" fill="url(#orange)"/>
      <text x="242" y="270" font-size="116" fill="#ffffff" text-anchor="middle">HTML</text>
    </g>
    <text x="458" y="262" font-size="86" fill="#ffffff" text-anchor="middle" opacity="0.95">+</text>
    <g filter="url(#pop)" transform="rotate(2.5 600 255)">
      <rect x="482" y="162" width="308" height="140" rx="26" fill="url(#blue)"/>
      <text x="636" y="268" font-size="106" fill="#ffffff" text-anchor="middle">CSS</text>
    </g>

    <!-- yellow marker -->
    <g transform="rotate(-2 270 420)">
      <rect x="52" y="338" width="560" height="104" rx="14" fill="#fde047"/>
      <text x="76" y="418" font-size="76" fill="#3b0764">FROM ZERO!</text>
    </g>
  </g>

  <g font-family="'Segoe UI', Arial, sans-serif" fill="#ffffff">
    <text x="64" y="506" font-size="38" font-weight="700">Build your first real website</text>
    <text x="64" y="552" font-size="30" opacity="0.92">Live code you can edit · Quizzes · Assignments</text>
  </g>

  <!-- chips -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="28" text-anchor="middle">
    <rect x="64" y="596" width="200" height="60" rx="30" fill="#ffffff"/>
    <text x="164" y="636" fill="#be185d">BEGINNER</text>
    <rect x="284" y="596" width="290" height="60" rx="30" fill="#ffffff"/>
    <text x="429" y="636" fill="#4c1d95">CERTIFICATE</text>
  </g>

  <!-- ===== Browser mockup (right) ===== -->
  <g transform="translate(822 168) rotate(5) scale(0.84) translate(-690 -132)" filter="url(#shadow)">
    <rect x="690" y="132" width="470" height="430" rx="22" fill="#ffffff"/>
    <rect x="690" y="132" width="470" height="56" rx="22" fill="#e2e8f0"/>
    <rect x="690" y="166" width="470" height="22" fill="#e2e8f0"/>
    <circle cx="722" cy="160" r="9" fill="#f87171"/>
    <circle cx="752" cy="160" r="9" fill="#fbbf24"/>
    <circle cx="782" cy="160" r="9" fill="#34d399"/>
    <rect x="820" y="146" width="316" height="28" rx="14" fill="#ffffff"/>

    <!-- page: hero -->
    <rect x="714" y="206" width="422" height="150" rx="14" fill="url(#hero)"/>
    <rect x="740" y="234" width="230" height="22" rx="11" fill="#ffffff"/>
    <rect x="740" y="268" width="170" height="12" rx="6" fill="#ffffff" opacity="0.75"/>
    <rect x="740" y="290" width="140" height="12" rx="6" fill="#ffffff" opacity="0.75"/>
    <rect x="740" y="316" width="120" height="30" rx="15" fill="#fde047"/>
    <!-- page: cards -->
    <rect x="714" y="376" width="132" height="160" rx="14" fill="#ffedd5"/>
    <circle cx="780" cy="418" r="22" fill="#f97316"/>
    <rect x="734" y="458" width="92" height="12" rx="6" fill="#fdba74"/>
    <rect x="734" y="480" width="70" height="10" rx="5" fill="#fed7aa"/>
    <rect x="862" y="376" width="132" height="160" rx="14" fill="#dbeafe"/>
    <circle cx="928" cy="418" r="22" fill="#3b82f6"/>
    <rect x="882" y="458" width="92" height="12" rx="6" fill="#93c5fd"/>
    <rect x="882" y="480" width="70" height="10" rx="5" fill="#bfdbfe"/>
    <rect x="1010" y="376" width="126" height="160" rx="14" fill="#fce7f3"/>
    <circle cx="1073" cy="418" r="22" fill="#ec4899"/>
    <rect x="1028" y="458" width="88" height="12" rx="6" fill="#f9a8d4"/>
    <rect x="1028" y="480" width="66" height="10" rx="5" fill="#fbcfe8"/>
  </g>

  <!-- floating code badge -->
  <g filter="url(#pop)" transform="rotate(-8 1130 600)">
    <rect x="1000" y="556" width="200" height="100" rx="22" fill="#0f172a"/>
    <text x="1100" y="624" font-family="Consolas, Menlo, 'Courier New', monospace" font-weight="700" font-size="60" fill="#34d399" text-anchor="middle">&lt;/&gt;</text>
  </g>

  <!-- FREE starburst -->
  <g filter="url(#pop)" transform="rotate(12 1180 118)">
    <polygon fill="#fde047" points="1180,30 1203,70 1250,66 1230,108 1262,144 1217,156 1213,204 1176,176 1137,204 1136,156 1094,142 1124,106 1108,64 1154,70"/>
    <text x="1180" y="136" font-family="'Arial Black', Impact, Arial, sans-serif" font-weight="900" font-size="46" fill="#be185d" text-anchor="middle">FREE</text>
  </g>
</svg>
